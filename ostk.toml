# ostk.toml — default project configuration shipped in the governance bail.
# `ostk init` writes a copy of this into each new project.
#
# Identity, trust roots, distribution mirrors, and the onboarding ceremony
# live in the bail's manifest.json + .primefile — NOT here. This file is
# per-project: what kernel does this project want, which pin is default,
# which features are on.

[project]
name = "{PROJECT_NAME}"

[kernel]
# Lower bound is the release that pack-bail.yml ran against.
# pack-bail.yml rewrites this line on every release; agents should not
# hand-edit it.
version = ">=7.0.0"
boot_mode = "embedded-first"
daemon_lifecycle = "tui-owned"
laws = [
  "invisible-write",
  "ephemeral",
  "filesystem",
  "OCC",
  "invisible-infra",
]

[pins.default]
# Default capability pin. The full grammar lives in .ostk/pins/default/pin.caps
# — these fields are a SUMMARY for `ostk show config`. Edit pin.caps for
# semantic changes; this block is informational.
read = [".", "~/.claude/projects/", "~/.cache/", "/tmp/"]
write = [".ostk/", "~/.cache/ostk/", "/tmp/", "/workspace/"]
execute = "shell(governed)"
deny = ["write-kernel", "modify-governance", "write-secret"]

[features]
tui = true
agents = true
audit = true
digest = true
embeddings = false
